# Probe TEMPORAL (se borra antes del merge): mide cobertura de fuentes externas desde Actions.
name: Probe histórico
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/probe/probe.mjs
